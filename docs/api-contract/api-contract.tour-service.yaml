openapi: 3.0.3
info:
  title: Hila Tours - Tour Service API
  description: >
    API for managing tours, buses, pickup points, seat requests/bookings,
    and the manifest report. Tour/bus/seat-management routes require an
    admin JWT; seat booking requests do not (passengers are not
    authenticated — see glossary.md). All identity fields are `id` (a
    server-generated uuid) — Mongo `_id` is internal-only and never
    serialized to a client (see database-rules.md "External Identity").
  version: 1.0.0

servers:
  - url: http://localhost:3033/tour-service/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string

    PickupPoint:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Central Station"
        order:
          type: integer
          example: 1

    Tour:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        date:
          type: string
          format: date-time
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft-delete timestamp. Null means the tour is active.
        buses:
          type: array
          description: >
            Only present on GET /tour and GET /tour/{tourId} (public,
            unauthenticated routes) — buses embedded with their seats in the
            PII-safe PublicSeat projection, so passengers can render the seat
            map before logging in. Omitted on write responses (POST/PUT/DELETE
            /tour), which return the tour document only. Excludes
            soft-deleted buses.
          items:
            $ref: '#/components/schemas/BusWithPublicSeats'

    TourInput:
      type: object
      required:
        - name
        - date
      properties:
        name:
          type: string
          example: "Eilat Weekend Tour"
        date:
          type: string
          format: date-time
        description:
          type: string

    Bus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tourId:
          type: string
          format: uuid
        name:
          type: string
          example: "Bus 1"
        seatLayout:
          type: object
          description: >
            Either `{ positions: string[] }` / `{ seats: string[] }` (explicit
            seat-position list), or `{ rows: number, columns: number | string[] }`
            (grid — columns default to A, B, C... when given as a count).
        pickupPoints:
          type: array
          items:
            $ref: '#/components/schemas/PickupPoint'
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft-delete timestamp. Null means the bus is active.

    BusInput:
      type: object
      description: >
        `seatLayout` and `busTypeId` are mutually exclusive — supply exactly
        one, never both. `seatLayout` defines the layout manually (as today);
        `busTypeId` generates it server-side from the referenced BusType
        template (see F11 in PRD.md). A request supplying both, or neither,
        is rejected with 400.
      required:
        - name
      properties:
        name:
          type: string
          example: "Bus 1"
        seatLayout:
          type: object
          nullable: true
          description: Required unless `busTypeId` is supplied instead. Mutually exclusive with `busTypeId`.
        pickupPoints:
          type: array
          items:
            $ref: '#/components/schemas/PickupPoint'
        busTypeId:
          type: string
          format: uuid
          nullable: true
          description: >
            Required unless `seatLayout` is supplied instead. Mutually
            exclusive with `seatLayout` — sending both fields is a 400, not
            a "busTypeId wins" merge.

    BusType:
      type: object
      description: >
        A reusable bus layout template (grid of standard rows, a door-row
        position, a back bench row, and individually disabled seat slots),
        independent of any tour/bus instance. Instantiating a Bus from a
        BusType converts it into a concrete `seatLayout` — editing a BusType
        afterwards never retroactively changes buses already created from it.
        Design source: raw_from_ai_studio/src/components/BusTypeManagement.tsx.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "אוטובוס 55 מקומות"
        description:
          type: string
          nullable: true
        totalSeats:
          type: integer
          description: Derived from the layout fields below; recomputed server-side on every write, never trusted from the client.
          example: 55
        standardRowsCount:
          type: integer
          description: Number of standard 4-seat rows (2 seats each side of the aisle).
          example: 13
        doorRow:
          type: integer
          nullable: true
          description: 1-based row index where the middle door replaces the right-side seat pair (cols 3-4). Null means no middle door.
          example: 7
        backRowSeatsCount:
          type: integer
          description: Number of seats in the final bench row (no aisle).
          example: 5
        disabledSeatSlots:
          type: array
          items:
            type: string
          description: '`"row-col"` keys (e.g. `"3-2"`) for slots blocked in the grid (no seat rendered/bookable there).'
        isDefault:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Soft-delete timestamp. Null means the bus type is active.

    BusTypeInput:
      type: object
      required:
        - name
        - standardRowsCount
        - backRowSeatsCount
      properties:
        name:
          type: string
          example: "אוטובוס 55 מקומות"
        description:
          type: string
        standardRowsCount:
          type: integer
          example: 13
        doorRow:
          type: integer
          nullable: true
          example: 7
        backRowSeatsCount:
          type: integer
          example: 5
        disabledSeatSlots:
          type: array
          items:
            type: string
        isDefault:
          type: boolean

    BusWithPublicSeats:
      description: >
        A Bus as embedded in a public tour response, plus its seats in the
        PII-safe PublicSeat projection.
      allOf:
        - $ref: '#/components/schemas/Bus'
        - type: object
          properties:
            totalSeats:
              type: integer
              description: >
                Seat count for the bus. Drives the row/column layout the
                passenger seat map is rendered from.
              example: 52
            seats:
              type: array
              items:
                $ref: '#/components/schemas/PublicSeat'

    PublicSeat:
      type: object
      description: >
        PII-safe seat projection for UNAUTHENTICATED routes. Contains only
        identity, position and status — never `passengerName`,
        `passengerPhone`, `notes`, `pickupPointName`, `requestedAt`,
        `approvedAt`, or admin attribution.

        This mirrors the SEV-001 decision that locked
        `GET /tour/{tourId}/buses/{busId}` behind `requireAdmin` precisely
        because it returns the full Seat schema. Public callers get status
        only, so an occupied seat renders as taken/pending with no indication
        of who occupies it.
      properties:
        id:
          type: string
          format: uuid
        position:
          type: string
          example: "3A"
        status:
          $ref: '#/components/schemas/SeatStatus'

    Seat:
      type: object
      description: >
        Full seat record, INCLUDING passenger PII. Only ever returned from
        admin-authenticated routes (see SEV-001), or as the direct response to
        the passenger's own booking request. Public listing routes must use
        PublicSeat instead. Admin attribution (`assignedBy`) is internal-only
        and never serialized, even here.
      properties:
        id:
          type: string
          format: uuid
        busId:
          type: string
          format: uuid
        position:
          type: string
          example: "3A"
        status:
          $ref: '#/components/schemas/SeatStatus'
        pickupPointName:
          type: string
          nullable: true
        passengerName:
          type: string
          nullable: true
        passengerPhone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time

    SeatStatus:
      type: string
      enum:
        - available
        - pending
        - taken
        - reserved
      description: Canonical seat states — see glossary.md. Never use any other value.

    SeatBookingRequest:
      type: object
      description: >
        Only `passengerName` is required (alongside `seatIds`) —
        `passengerPhone`/`pickupPointName` are optional (a passenger may not
        have decided on a pickup point yet, or prefers not to share a phone).
      required:
        - seatIds
        - passengerName
      properties:
        seatIds:
          type: array
          items:
            type: string
            format: uuid
          description: One or more seat IDs being requested in a single booking (max 4).
        passengerName:
          type: string
        passengerPhone:
          type: string
        pickupPointName:
          type: string
        notes:
          type: string

    SeatApproveRequest:
      type: object
      required:
        - seatIds
      properties:
        seatIds:
          type: array
          items:
            type: string
            format: uuid
          description: Pending seat IDs to approve → taken.

    SeatCancelRequest:
      type: object
      required:
        - seatIds
      properties:
        seatIds:
          type: array
          items:
            type: string
            format: uuid
          description: Pending or taken seat IDs to release → available.

    SeatToggleReserveRequest:
      type: object
      required:
        - seatIds
      properties:
        seatIds:
          type: array
          items:
            type: string
            format: uuid
          description: Seat IDs to lock as reserved, or unlock back to available.

    SeatManualAssignRequest:
      type: object
      description: >
        Admin manual-assign payload (F7). Accepts either an explicit `seatId`
        (uuid) or the frontend's `seatNumbers` shape (1-based seat number,
        resolved against the bus's seats in position order — only the first
        entry is used). Only `passengerName` is required — `passengerPhone`/
        `pickupPointName`/`pickupPoint` are optional (admin may not have that
        info yet when reserving a seat manually).
      required:
        - passengerName
      properties:
        seatId:
          type: string
          format: uuid
        seatNumbers:
          type: array
          items:
            type: integer
        passengerName:
          type: string
        passengerPhone:
          type: string
        pickupPointName:
          type: string
        pickupPoint:
          type: string
          description: Alternate field name accepted alongside pickupPointName.
        notes:
          type: string
        status:
          type: string
          enum: [taken, pending]
          description: Target status. Defaults to `taken` if omitted.
      required:
        - passengerName
        - passengerPhone

    SeatSwapMoveRequest:
      type: object
      description: >
        Admin swap-move payload (F7). Accepts either 1-based seat numbers
        (`fromSeat`/`toSeat`, resolved against the bus's seats in position
        order) or explicit seat uuids (`fromSeatId`/`toSeatId`). If the
        destination seat is available, the passenger is moved and the source
        seat is vacated. If the destination is occupied, the two passengers
        are swapped.
      properties:
        fromSeat:
          type: integer
        toSeat:
          type: integer
        fromSeatId:
          type: string
          format: uuid
        toSeatId:
          type: string
          format: uuid

    ManifestPassengerEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The seat's id.
        seatPosition:
          type: string
        passengerName:
          type: string
          nullable: true
        passengerPhone:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/SeatStatus'

    ManifestEntry:
      type: object
      properties:
        pickupPointName:
          type: string
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/ManifestPassengerEntry'

paths:
  /tour:
    get:
      tags: [Tour]
      summary: List all open (non-deleted) tours
      description: >
        Public — no auth required. Each tour embeds its buses, each with
        seats in the PII-safe PublicSeat projection, so passengers can render
        the seat map before logging in.
      responses:
        '200':
          description: List of tours
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tour'
    post:
      tags: [Tour]
      summary: Create a tour
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourInput'
      responses:
        '200':
          description: Tour created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT

  /tour/{tourId}:
    get:
      tags: [Tour]
      summary: Get a single tour, with embedded buses/seats
      description: Public — no auth required. Same public seat-map projection as GET /tour.
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
        '404':
          description: Tour not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Tour]
      summary: Update a tour
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourInput'
      responses:
        '200':
          description: Tour updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Tour not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Tour]
      summary: Soft-delete a tour
      description: >
        Sets `deletedAt` rather than removing the document (see
        database-rules.md). Cascades: all of the tour's buses are also
        soft-deleted, and their seats are hard-deleted (seats have no
        independent soft-delete state).
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tour soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tour'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Tour not found or already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /busType:
    get:
      tags: [BusType]
      summary: List all open (non-deleted) bus type templates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of bus types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BusType'
        '401':
          description: Missing/invalid admin JWT
    post:
      tags: [BusType]
      summary: Create a bus type template
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusTypeInput'
      responses:
        '200':
          description: Bus type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusType'
        '400':
          description: Missing/invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT

  /busType/{busTypeId}:
    put:
      tags: [BusType]
      summary: Update a bus type template
      description: >
        Never retroactively changes buses already instantiated from this
        template — `seatLayout` on existing buses is not remapped.
      security:
        - bearerAuth: []
      parameters:
        - name: busTypeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusTypeInput'
      responses:
        '200':
          description: Bus type updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusType'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Bus type not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [BusType]
      summary: Soft-delete a bus type template
      description: >
        Sets `deletedAt` rather than removing the document (see
        database-rules.md). Does not affect buses already instantiated
        from this template.
      security:
        - bearerAuth: []
      parameters:
        - name: busTypeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bus type soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusType'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Bus type not found or already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tour/{tourId}/buses:
    get:
      tags: [Bus]
      summary: List a tour's buses
      description: Public — no auth required. Buses only, no seats (see the per-bus GET for seats).
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of buses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bus'
    post:
      tags: [Bus]
      summary: Create a bus (pre-creates its seats from seatLayout, or from a BusType template)
      description: >
        Provide exactly one of `seatLayout` or `busTypeId` in the request
        body — supplying both, or neither, is rejected with 400.
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusInput'
      responses:
        '200':
          description: Bus created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
        '400':
          description: >
            Missing/invalid name; missing both `seatLayout` and `busTypeId`;
            or both `seatLayout` and `busTypeId` supplied together.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: busTypeId does not reference an existing (non-deleted) bus type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tour/{tourId}/buses/{busId}:
    get:
      tags: [Bus]
      summary: Get a bus and its full seat map (admin only)
      description: >
        Admin-only: seats embed passenger PII (passengerName, passengerPhone).
        The public passenger-facing seat map does not use this route — it
        reads the PublicSeat projection embedded in GET /tour instead
        (see SEV-001).
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bus details with seats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Bus'
                  - type: object
                    properties:
                      seats:
                        type: array
                        items:
                          $ref: '#/components/schemas/Seat'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Bus]
      summary: Update a bus (name, pickup points, or re-instantiate its seat map from a BusType, preserving matching seats)
      description: >
        Sending `busTypeId` on an UPDATE (product decision, 2026-08-22)
        regenerates the bus's `seatLayout` from the referenced template and
        reseeds its seats **by position**: any seat whose `position` exists
        in both the old and new layout keeps its exact state untouched
        (status, passenger name/phone, pickup point, etc. — including
        `pending`/`taken`/`reserved` seats). Only seats at positions that
        exist in the OLD layout but not the new one are removed, along with
        whatever occupant they had — e.g. shrinking to a smaller template,
        or switching to a template whose door-row position shifts seat
        numbering. New positions introduced by the new template are created
        `available`. `seatLayout` sent alongside `busTypeId` is ignored —
        `busTypeId` always wins on update (unlike `POST .../buses`, where the
        two are mutually exclusive and a 400 is returned if both are sent).
        There is no server-side confirmation step; the caller (admin
        frontend) is responsible for confirming with the admin before
        sending this when it may drop seats. Omitting `busTypeId` (sending
        only `name`/`pickupPoints`) leaves the existing seat map untouched.
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusInput'
      responses:
        '200':
          description: Bus updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Bus]
      summary: Soft-delete a bus from a tour
      description: >
        Sets `deletedAt` on the bus rather than removing it from the
        database. Its seats are hard-deleted (not soft-deleted individually)
        since a seat has no meaning outside its bus.
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bus soft-deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bus'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Bus not found or already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tour/{tourId}/buses/{busId}/seats/bookings:
    post:
      tags: [Seat]
      summary: Passenger seat booking request (available → pending)
      description: >
        Public — no auth required (passengers are not authenticated accounts,
        see glossary.md). Atomic per-seat: if ANY requested seat is no longer
        available, the whole request fails with 409 and any seats already
        claimed in this call are rolled back to available. Max 4 seats per
        request.
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatBookingRequest'
      responses:
        '200':
          description: The requested seats, now pending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        '400':
          description: Missing fields, invalid seatIds, or more than 4 seats requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: One or more requested seats are no longer available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tour/{tourId}/buses/{busId}/seats/approve:
    post:
      tags: [Seat]
      summary: Admin approve (pending → taken)
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatApproveRequest'
      responses:
        '200':
          description: The approved seats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        '400':
          description: One or more seats are not currently pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT

  /tour/{tourId}/buses/{busId}/seats/cancel:
    post:
      tags: [Seat]
      summary: Admin cancel/release (pending|taken → available)
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatCancelRequest'
      responses:
        '200':
          description: The released seats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        '400':
          description: One or more seats cannot be cancelled from their current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT

  /tour/{tourId}/buses/{busId}/seats/toggle-reserve:
    post:
      tags: [Seat]
      summary: Admin toggle-reserve (available ⇄ reserved)
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatToggleReserveRequest'
      responses:
        '200':
          description: The toggled seats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        '400':
          description: One or more seats are not available or reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT

  /tour/{tourId}/buses/{busId}/seats/manual-assign:
    post:
      tags: [Seat]
      summary: Admin manual-assign (available → taken|pending)
      description: Returns the bus's full, fresh seat list so the client can re-sync the seat map.
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatManualAssignRequest'
      responses:
        '200':
          description: The bus's full seat list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        '400':
          description: Missing fields, or the target seat is not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT

  /tour/{tourId}/buses/{busId}/seats/swap-move:
    post:
      tags: [Seat]
      summary: Admin swap-move a passenger between two seats
      description: >
        If the destination seat is available, the passenger is moved there
        and the source seat is vacated. If the destination is occupied
        (pending/taken), the two passengers are swapped. Both seats are
        re-validated server-side against the status observed when the
        decision was made.
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatSwapMoveRequest'
      responses:
        '200':
          description: The two affected seats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Seat'
        '400':
          description: Invalid request, or the source seat has no passenger to move
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Seat not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Source or destination seat changed concurrently during the operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tour/{tourId}/buses/{busId}/manifest:
    get:
      tags: [Manifest]
      summary: Consolidated passenger manifest for a bus, grouped by pickup point
      description: >
        Only seats with an assigned passenger (pending/taken) are included by
        default, unless the `status` filter selects a different status.
        Groups are ordered by the bus's declared pickup-point order.
      security:
        - bearerAuth: []
      parameters:
        - name: tourId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: busId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pickupPointName
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SeatStatus'
      responses:
        '200':
          description: Manifest entries grouped by pickup point
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManifestEntry'
        '401':
          description: Missing/invalid admin JWT
        '404':
          description: Bus not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
