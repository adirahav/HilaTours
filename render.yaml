# Render Blueprint for Hila Tours.
# Three backend services + shared env var groups, matching the architecture
# in agents/backend/CLAUDE.md: common-service is the gateway (static frontend
# host + reverse proxy). user-management-service and tour-service are meant
# to be private/internal-only in a real production setup, but Render's free
# tier has no Private Service (pserv) option — that requires a paid plan per
# service. To keep this learning project free, all three run as public Web
# Services instead; they're still not *linked* from the frontend directly
# (all traffic still goes through common-service's proxy), but each one IS
# independently reachable if someone has/guesses its URL. That's a real,
# accepted trade-off for $0 hosting, not an oversight — see "Manual one-time
# setup" note 5 below for what upgrading back to pserv later would take.
#
# Docs: https://render.com/docs/blueprint-spec

envVarGroups:
  - name: hila-tours-db-auth
    envVars:
      - key: MONGODB_URI
        sync: false # set manually in the Render dashboard — never commit this value
      - key: DB_NAME
        value: HILA_TOURS_DB
      - key: JWT_SECRET
        generateValue: true # Render generates one value and shares it across every service in this group
      - key: JWT_EXPIRES_IN
        value: 7d

  - name: hila-tours-frontend-url
    envVars:
      - key: FRONTEND_URL
        sync: false # set manually once the common-service URL is known (see note below)

services:
  # ── common-service: public gateway (static frontend + reverse proxy) ──────
  - type: web
    name: common-service
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/common-service
    buildCommand: cd ../../frontend && npm install && npm run build && cd ../backend/common-service && npm install && npx tsc
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: hila-tours-frontend-url
      - key: PORT
        value: 3034
      - key: TOUR_SERVICE_URL
        fromService:
          type: web
          name: tour-service
          property: hostport
      - key: USER_MANAGEMENT_SERVICE_URL
        fromService:
          type: web
          name: user-management-service
          property: hostport

  # ── user-management-service: auth. Public Web Service on the free plan —
  # see the top-of-file note on the pserv/free-tier trade-off.
  - type: web
    name: user-management-service
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/user-management-service
    buildCommand: npm install && npx tsc
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: hila-tours-db-auth
      - fromGroup: hila-tours-frontend-url
      - key: PORT
        value: 3032

  # ── tour-service: tour/bus/seat domain. Public Web Service on the free
  # plan — see the top-of-file note on the pserv/free-tier trade-off.
  - type: web
    name: tour-service
    runtime: node
    plan: free
    region: oregon
    rootDir: backend/tour-service
    buildCommand: npm install && npx tsc
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - fromGroup: hila-tours-db-auth
      - fromGroup: hila-tours-frontend-url
      - key: PORT
        value: 3033

# ── Manual one-time setup after the first deploy ─────────────────────────────
# 1. Set MONGODB_URI on the hila-tours-db-auth group (Atlas connection string).
# 2. Set FRONTEND_URL on the hila-tours-frontend-url group to common-service's
#    public Render URL, once it's known (chicken-and-egg on the very first deploy —
#    deploy once, copy the URL, then set this and redeploy).
# 3. Confirm MongoDB Atlas Network Access allows connections from Render
#    (see the project punch list — "Atlas network access" is still open).
# 4. common-service's buildCommand now builds the frontend first (npm run
#    build in frontend/, per agents/frontend/CLAUDE.md Step 8's vite.config.ts
#    outDir) before compiling common-service itself, so backend/common-service
#    /public exists at deploy time even though it's gitignored and not
#    committed. No separate frontend service/step needed.
# 5. user-management-service and tour-service are public Web Services here
#    (free plan), not Private Services — Render's free tier has no pserv
#    option; pserv requires a paid plan per service. CORS still restricts
#    browser-based requests to FRONTEND_URL, but each service's URL is
#    directly reachable by anyone who has/guesses it (e.g. via curl), not
#    gated behind common-service. Accepted for a learning project at $0; to
#    close that gap later, switch both to `type: pserv` and upgrade their
#    `plan` off `free`.
